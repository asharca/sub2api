<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Model Train</title>
  <desc id="desc">A portal with flows converging in and fanning out, representing unified intelligent routing.</desc>
  <defs>
    <linearGradient id="gw-bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" />
      <stop offset="1" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#gw-bg)" />
  <!-- flows: in from the left, out to the right -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round">
    <path d="M148 172 C 192 172 192 234 230 248" opacity="0.7" />
    <path d="M148 256 L 230 256" />
    <path d="M148 340 C 192 340 192 278 230 264" opacity="0.7" />
    <path d="M282 248 C 320 234 320 172 364 172" opacity="0.7" />
    <path d="M282 256 L 364 256" />
    <path d="M282 264 C 320 278 320 340 364 340" opacity="0.7" />
  </g>
  <!-- endpoint nodes -->
  <g fill="#FFFFFF">
    <circle cx="128" cy="172" r="15" opacity="0.85" />
    <circle cx="128" cy="256" r="15" />
    <circle cx="128" cy="340" r="15" opacity="0.85" />
    <circle cx="384" cy="172" r="15" opacity="0.85" />
    <circle cx="384" cy="256" r="15" />
    <circle cx="384" cy="340" r="15" opacity="0.85" />
  </g>
  <!-- portal -->
  <path
    fill="#FFFFFF"
    fill-rule="evenodd"
    opacity="0.96"
    d="M256 152 a48 48 0 0 1 48 48 v112 a48 48 0 0 1 -96 0 v-112 a48 48 0 0 1 48 -48 z
       M256 190 a26 26 0 0 1 26 26 v80 a26 26 0 0 1 -52 0 v-80 a26 26 0 0 1 26 -26 z"
  />
</svg>
